services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shawarma}
      POSTGRES_USER: ${POSTGRES_USER:-shawarma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports: ["5432:5432"]
    volumes: [shawarma_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shawarma_user} -d ${POSTGRES_DB:-shawarma}"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  shawarma_data:
