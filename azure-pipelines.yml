
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

# ==========================================
# POSTGRESQL PARA PRUEBAS AUTOMATIZADAS
# ==========================================

resources:
  containers:
    - container: postgres
      image: postgres:16-alpine
      env:
        POSTGRES_DB: shawarma_test
        POSTGRES_USER: shawarma_user
        POSTGRES_PASSWORD: shawarma_ci_password
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U shawarma_user -d shawarma_test"
        --health-interval 5s
        --health-timeout 3s
        --health-retries 10

# ==========================================
# TRABAJO PRINCIPAL DE INTEGRACION CONTINUA
# ==========================================

jobs:
  - job: CI
    displayName: 'CI - Restaurante Shawarma'

    services:
      postgres: postgres

    steps:

      # ==========================================
      # 1. CONFIGURACION DE NODE.JS
      # ==========================================

      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: 'Instalar Node.js 22'

      - script: |
          echo "========== VERSIONES =========="
          node --version
          npm --version
        displayName: 'Verificar entorno Node.js'


      # ==========================================
      # 2. FRONTEND - REACT + VITE + VITEST
      # ==========================================

      # Instalar dependencias

      - script: npm ci
        workingDirectory: frontend
        displayName: 'Frontend - Instalar dependencias'

      # Verificar versiones instaladas

      - script: |
          npm ls vite vitest @vitest/coverage-v8 jsdom
        workingDirectory: frontend
        displayName: 'Frontend - Verificar dependencias'

      # Ejecutar pruebas y cobertura

      - script: npm run test:ci
        workingDirectory: frontend
        displayName: 'Frontend - Ejecutar pruebas y cobertura'

      # Publicar resultados JUnit

      - task: PublishTestResults@2
        displayName: 'Frontend - Publicar resultados de pruebas'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit.xml'
          searchFolder: '$(Build.SourcesDirectory)/frontend'
          failTaskOnFailedTests: true
          testRunTitle: 'Pruebas Frontend - Shawarma'

      # Publicar cobertura

      - task: PublishCodeCoverageResults@2
        displayName: 'Frontend - Publicar cobertura'
        condition: succeededOrFailed()
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Build.SourcesDirectory)/frontend/coverage/cobertura-coverage.xml'
          pathToSources: '$(Build.SourcesDirectory)/frontend'
          failIfCoverageEmpty: true

      # Construir aplicación

      - script: npm run build
        workingDirectory: frontend
        displayName: 'Frontend - Construir aplicación'


      # ==========================================
      # 3. BACKEND - NODE.JS + PRISMA + POSTGRESQL
      # ==========================================

      # Instalar dependencias

      - script: npm ci
        workingDirectory: backend
        displayName: 'Backend - Instalar dependencias'

      # Generar cliente Prisma

      - script: npx prisma generate
        workingDirectory: backend
        displayName: 'Backend - Generar cliente Prisma'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@postgres:5432/shawarma_test?schema=public'

      # Aplicar migraciones

      - script: npx prisma migrate deploy
        workingDirectory: backend
        displayName: 'Backend - Aplicar migraciones'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@postgres:5432/shawarma_test?schema=public'

      # Ejecutar pruebas unitarias e integración

      - script: npm run test:coverage
        workingDirectory: backend
        displayName: 'Backend - Ejecutar pruebas y cobertura'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@postgres:5432/shawarma_test?schema=public'

      # Publicar resultados JUnit

      - task: PublishTestResults@2
        displayName: 'Backend - Publicar resultados de pruebas'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit.xml'
          searchFolder: '$(Build.SourcesDirectory)/backend'
          failTaskOnFailedTests: true
          testRunTitle: 'Pruebas Backend - Shawarma'

      # Publicar cobertura

      - task: PublishCodeCoverageResults@2
        displayName: 'Backend - Publicar cobertura'
        condition: succeededOrFailed()
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Build.SourcesDirectory)/backend/coverage/cobertura-coverage.xml'
          pathToSources: '$(Build.SourcesDirectory)/backend'
          failIfCoverageEmpty: true

      # Construir Backend

      - script: npm run build
        workingDirectory: backend
        displayName: 'Backend - Construir aplicación'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@postgres:5432/shawarma_test?schema=public'
