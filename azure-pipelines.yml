
trigger:
  branches:
    include:
      - main

# Agente predeterminado para CI
pool:
  vmImage: 'ubuntu-latest'

# ==========================================
# POSTGRESQL PARA PRUEBAS AUTOMATIZADAS
# ==========================================

resources:
  containers:
    - container: postgres
      image: postgres:16-alpine
      env:
        POSTGRES_DB: shawarma_test
        POSTGRES_USER: shawarma_user
        POSTGRES_PASSWORD: shawarma_ci_password
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U shawarma_user -d shawarma_test"
        --health-interval 5s
        --health-timeout 3s
        --health-retries 10

jobs:

  # ==========================================
  # JOB 1 - INTEGRACION CONTINUA
  # ==========================================

  - job: CI
    displayName: 'CI - Restaurante Shawarma'

    services:
      postgres: postgres

    steps:

      # ==========================================
      # 1. CONFIGURACION DE NODE.JS
      # ==========================================

      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: 'Instalar Node.js 22'

      - script: |
          echo "========== VERSIONES =========="
          node --version
          npm --version
        displayName: 'Verificar entorno Node.js'


      # ==========================================
      # 2. FRONTEND - REACT + VITE + VITEST
      # ==========================================

      - script: npm ci
        workingDirectory: frontend
        displayName: 'Frontend - Instalar dependencias'

      - script: |
          npm ls vite vitest @vitest/coverage-v8 jsdom
        workingDirectory: frontend
        displayName: 'Frontend - Verificar dependencias'

      - script: npm run test:ci
        workingDirectory: frontend
        displayName: 'Frontend - Ejecutar pruebas y cobertura'

      - task: PublishTestResults@2
        displayName: 'Frontend - Publicar resultados de pruebas'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit.xml'
          searchFolder: '$(Build.SourcesDirectory)/frontend'
          failTaskOnFailedTests: true
          testRunTitle: 'Pruebas Frontend - Shawarma'

      - task: PublishCodeCoverageResults@2
        displayName: 'Frontend - Publicar cobertura'
        condition: succeededOrFailed()
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Build.SourcesDirectory)/frontend/coverage/cobertura-coverage.xml'
          pathToSources: '$(Build.SourcesDirectory)/frontend'
          failIfCoverageEmpty: true

      - script: npm run build
        workingDirectory: frontend
        displayName: 'Frontend - Construir aplicación'


      # ==========================================
      # 3. BACKEND - NODE.JS + PRISMA + POSTGRESQL
      # ==========================================

      - script: npm ci
        workingDirectory: backend
        displayName: 'Backend - Instalar dependencias'

      - script: npx prisma generate
        workingDirectory: backend
        displayName: 'Backend - Generar cliente Prisma'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@localhost:5432/shawarma_test?schema=public'

      - script: npx prisma migrate deploy
        workingDirectory: backend
        displayName: 'Backend - Aplicar migraciones'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@localhost:5432/shawarma_test?schema=public'

      - script: npm run test:coverage
        workingDirectory: backend
        displayName: 'Backend - Ejecutar pruebas y cobertura'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@localhost:5432/shawarma_test?schema=public'

      - task: PublishTestResults@2
        displayName: 'Backend - Publicar resultados de pruebas'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/junit.xml'
          searchFolder: '$(Build.SourcesDirectory)/backend'
          failTaskOnFailedTests: true
          testRunTitle: 'Pruebas Backend - Shawarma'

      - task: PublishCodeCoverageResults@2
        displayName: 'Backend - Publicar cobertura'
        condition: succeededOrFailed()
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Build.SourcesDirectory)/backend/coverage/cobertura-coverage.xml'
          pathToSources: '$(Build.SourcesDirectory)/backend'
          failIfCoverageEmpty: true

      - script: npm run build
        workingDirectory: backend
        displayName: 'Backend - Construir aplicación'
        env:
          DATABASE_URL: 'postgresql://shawarma_user:shawarma_ci_password@localhost:5432/shawarma_test?schema=public'


      # ==========================================
      # 4. PUBLICAR ARTEFACTOS LCOV
      # ==========================================

      - task: PublishPipelineArtifact@1
        displayName: 'Publicar LCOV Frontend'
        inputs:
          targetPath: '$(Build.SourcesDirectory)/frontend/coverage'
          artifact: 'frontend-coverage'

      - task: PublishPipelineArtifact@1
        displayName: 'Publicar LCOV Backend'
        inputs:
          targetPath: '$(Build.SourcesDirectory)/backend/coverage'
          artifact: 'backend-coverage'


  # ==========================================
  # JOB 2 - ANALISIS ESTATICO SONARQUBE
  # ==========================================

  - job: SonarQube
    displayName: 'SonarQube - Análisis de calidad'

    dependsOn: CI

    # Agente autohospedado Windows
    pool:
      name: 'default'

    steps:

      # ==========================================
      # 1. OBTENER CODIGO FUENTE
      # ==========================================

      - checkout: self
        fetchDepth: 0
        displayName: 'Obtener código fuente'


      # ==========================================
      # 2. DESCARGAR COBERTURA FRONTEND
      # ==========================================

      - task: DownloadPipelineArtifact@2
        displayName: 'Descargar cobertura Frontend'
        inputs:
          artifact: 'frontend-coverage'
          path: '$(Build.SourcesDirectory)/frontend/coverage'


      # ==========================================
      # 3. DESCARGAR COBERTURA BACKEND
      # ==========================================

      - task: DownloadPipelineArtifact@2
        displayName: 'Descargar cobertura Backend'
        inputs:
          artifact: 'backend-coverage'
          path: '$(Build.SourcesDirectory)/backend/coverage'


      # ==========================================
      # 4. VERIFICAR REPORTES LCOV
      # ==========================================

      - powershell: |
          Write-Host "======================================"
          Write-Host "VERIFICANDO REPORTES DE COBERTURA"
          Write-Host "======================================"

          $frontend = "$(Build.SourcesDirectory)/frontend/coverage/lcov.info"
          $backend = "$(Build.SourcesDirectory)/backend/coverage/lcov.info"

          if (!(Test-Path $frontend)) {
              throw "No se encontró el reporte LCOV del frontend: $frontend"
          }

          if (!(Test-Path $backend)) {
              throw "No se encontró el reporte LCOV del backend: $backend"
          }

          Write-Host "LCOV Frontend encontrado."
          Write-Host "LCOV Backend encontrado."
          Write-Host "Ambos reportes están disponibles."
        displayName: 'Verificar reportes de cobertura'


      # ==========================================
      # 5. VERIFICAR CONEXION SONARQUBE
      # ==========================================

      - powershell: |
          Write-Host "Verificando conexión con SonarQube..."

          try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:9000/api/system/status" `
                -UseBasicParsing `
                -TimeoutSec 15

              Write-Host "Respuesta del servidor SonarQube:"
              Write-Host $response.Content
          }
          catch {
              throw "No se puede acceder a SonarQube en localhost:9000. Verifica que Docker esté activo y que el agente esté ejecutándose en el mismo equipo."
          }
        displayName: 'Verificar servidor SonarQube'


      # ==========================================
      # 6. PREPARAR ANALISIS SONARQUBE
      # ==========================================

      - task: SonarQubePrepare@8
        displayName: 'SonarQube - Preparar análisis'
        inputs:
          SonarQube: 'SonarQube-Shawarma'
          scannerMode: 'cli'
          configMode: 'file'
          configFile: 'sonar-project.properties'


      # ==========================================
      # 7. EJECUTAR ANALISIS ESTATICO
      # ==========================================

      - task: SonarQubeAnalyze@8
        displayName: 'SonarQube - Analizar código'


      # ==========================================
      # 8. PUBLICAR QUALITY GATE
      # ==========================================

      - task: SonarQubePublish@8
        displayName: 'SonarQube - Publicar Quality Gate'
        inputs:
          pollingTimeoutSec: '300'
